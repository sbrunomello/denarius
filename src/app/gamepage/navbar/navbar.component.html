<ion-header>
  <ion-toolbar>
    <ion-title>
      Menu
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleBuildMenu()">
        <ion-icon name="construct"></ion-icon>
      </ion-button>
      <ion-button (click)="toggleInventoryMenu()">
        <ion-icon name="bag-handle"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [class.show-build-menu]="showBuildMenu" [class.show-inventory-menu]="showInventoryMenu">
  <!-- Conteúdo do menu de construção -->
  <div class="menu-section" *ngIf="showBuildMenu">
    <ion-grid>
      <ion-row>
        <ion-col size="6" *ngFor="let building of buildingOptions">
          <ion-button (click)="selectBuilding(building)">
            {{ building }}
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <!-- Conteúdo do menu de inventário -->
  <div class="menu-section" *ngIf="showInventoryMenu">
    <!-- Adicione aqui os itens do inventário -->
  </div>
</ion-content>

<ion-header>
  <ion-toolbar>
    <ion-title>
      <ion-grid>
        <ion-row>
          <ion-col size="auto">
            <ion-item>
              <ion-label>🍖: </ion-label>
              <ion-badge slot="end" color="success">{{ food }}</ion-badge>
            </ion-item>
          </ion-col>
          <ion-col size="auto">
            <ion-item>
              <ion-label>🪓: </ion-label>
              <ion-badge slot="end" color="success">{{ wood }}</ion-badge>
            </ion-item>
          </ion-col>
          <ion-col size="auto">
            <ion-item>
              <ion-label>⛏: </ion-label>
              <ion-badge slot="end" color="success">{{ stone }}</ion-badge>
            </ion-item>
          </ion-col>
          <ion-col size="auto">
            <ion-item>
              <ion-label> 🧔👩 : </ion-label>
              <ion-badge slot="end" color="danger">{{ workers }}</ion-badge>
            </ion-item>
          </ion-col>
          <ion-col size="auto">
            <ion-item>
              <ion-label>💰: </ion-label>
              <ion-badge slot="end" color="warning">{{ denarius }}</ion-badge>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-title>
  </ion-toolbar>
</ion-header>
